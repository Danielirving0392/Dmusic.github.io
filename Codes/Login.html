<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | D Music</title>
    <link rel="stylesheet" href="../mystyles.css">
</head>

<body>
<div class="nav_contain">
    <img class="logo" src="../Assets/logo.png" alt="D Music Logo">

    <ul class="nav" id="top">
        <li><a href="index.html">Home</a></li>
        <li><a href="Registration.html">Register</a></li> 
        <li><a href="About_us.html">About Us</a></li>

    </ul>
</div>

<main class="container">

    <section>
        <fieldset>
            <form id="Loginform" name="Login">
                <h1>Login</h1>

                <!-- Username and password fields -->
                <div>
                    <label for="Username_log">Username</label><br>
                    <input type="text" name="Username_log" id="Username_log" placeholder="Enter your username" required>
                </div>

                <div>
                    <label for="password_log">Password</label><br>
                    <input type="password" name="Password_log" id="password_log" placeholder="Enter your password" required>
                </div>

                <!-- Error message shown here by Login.js -->
                <p id="login-error"></p>

                <p>Don't have an account? <a href="Registration.html">Sign up</a></p>

                <button class="button1" type="submit" id="Signin_btn">Sign in</button>
            </form>
        </fieldset>
    </section>

</main>

<footer>Daniel Irving © 2005990</footer>

<script src="../Codes/Login.js"></script>
</body>
</html>
